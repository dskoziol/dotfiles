# Get editor-friendly starship layout
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$kubernetes\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 3
read_only = " 🔒"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = "⬢ "
style = "bold green"
format = "via [$symbol($version)]($style) "

[rust]
symbol = "🦀 "
style = "bold red"
format = "via [$symbol($version)]($style) "

[python]
symbol = "🐍 "
style = "bold yellow"
format = "via [$symbol($version)]($style) "

[golang]
symbol = "🐹 "
style = "bold blue"
format = "via [$symbol($version)]($style) "
